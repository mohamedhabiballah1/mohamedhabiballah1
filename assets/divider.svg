<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 18" preserveAspectRatio="none" role="presentation">
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#2d8a6e" stop-opacity="0"/>
      <stop offset="80%" stop-color="#2d8a6e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2d8a6e" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="9" x2="1200" y2="9" stroke="#1b2932" stroke-opacity="0.12" stroke-width="1.4"/>
  <g>
    <rect x="-260" y="7.6" width="260" height="2.8" rx="1.4" fill="url(#trail)">
      <animate attributeName="x" from="-260" to="1200" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="0" cy="9" r="4" fill="#2d8a6e">
      <animate attributeName="cx" from="0" to="1200" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
